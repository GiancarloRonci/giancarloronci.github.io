<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: a sinistra il caricamento notturno (un solo blocco sotto una luna, grafico fermo);
       a destra un flusso continuo di eventi che entra nel data warehouse e aggiorna subito un grafico -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="1040" cy="95" r="3"/><circle cx="1080" cy="95" r="3"/><circle cx="1120" cy="95" r="3"/>
  </g>

  <!-- batch notturno: luna, un unico blocco, grafico sbiadito e fermo -->
  <g opacity="0.6">
    <path d="M190 120 a 34 34 0 1 0 34 44 a 26 26 0 1 1 -34 -44 z" fill="#8a8e96"/>
    <rect x="140" y="230" width="120" height="70" rx="8" fill="#9a9ea5" stroke="#ffffff" stroke-width="4"/>
    <path d="M200 312 l 0 48" stroke="#8a8e96" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
    <rect x="110" y="380" width="180" height="120" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
    <path d="M130 470 L 170 450 L 210 458 L 250 430" stroke="#c9d3d8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 430 L 270 430" stroke="#c9d3d8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
  </g>

  <!-- separatore -->
  <path d="M370 110 L 370 520" stroke="#c9d3d8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 14"/>

  <!-- flusso continuo di eventi -->
  <g fill="#2f7f93">
    <circle cx="450" cy="300" r="9" opacity="0.35"/>
    <circle cx="495" cy="300" r="10" opacity="0.5"/>
    <circle cx="545" cy="300" r="11" opacity="0.65"/>
    <circle cx="600" cy="300" r="12" opacity="0.8"/>
    <circle cx="660" cy="300" r="13"/>
  </g>
  <g fill="#e0a94a">
    <circle cx="470" cy="265" r="7" opacity="0.4"/>
    <circle cx="570" cy="335" r="8" opacity="0.7"/>
    <circle cx="630" cy="262" r="8"/>
  </g>
  <path d="M440 300 L 700 300" stroke="#2f7f93" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M690 286 l 18 14 l -18 14" stroke="#2f7f93" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- data warehouse: cilindro -->
  <g>
    <path d="M730 220 L 730 380 A 80 26 0 0 0 890 380 L 890 220" fill="#1f5a68"/>
    <ellipse cx="810" cy="220" rx="80" ry="26" fill="#3a8ea3"/>
    <path d="M730 275 A 80 26 0 0 0 890 275" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.35"/>
    <path d="M730 330 A 80 26 0 0 0 890 330" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.35"/>
  </g>

  <!-- pochi secondi: piccolo cronometro -->
  <g transform="translate(810 130)">
    <circle r="30" fill="#ffffff" stroke="#e0a94a" stroke-width="5"/>
    <rect x="-7" y="-44" width="14" height="10" rx="3" fill="#e0a94a"/>
    <path d="M0 0 L 0 -18" stroke="#1f5a68" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 L 12 7" stroke="#1f5a68" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- grafico aggiornato in tempo reale -->
  <path d="M900 300 L 940 300" stroke="#2f7f93" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <g>
    <rect x="950" y="200" width="200" height="200" rx="14" fill="#ffffff" stroke="#9cc6d1" stroke-width="2"/>
    <rect x="972" y="222" width="70" height="9" rx="4.5" fill="#1f5a68"/>
    <path d="M972 360 L 1004 334 L 1034 344 L 1064 300 L 1094 312 L 1124 262" stroke="#2f7f93" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1124" cy="262" r="9" fill="#e0a94a" stroke="#ffffff" stroke-width="3"/>
    <path d="M972 380 L 1128 380" stroke="#e1e4e8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- terreno -->
  <path d="M430 470 L 1150 470" stroke="#6b6e76" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
</svg>

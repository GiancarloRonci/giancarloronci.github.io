<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: tre blocchi in fila (strumenti martech, piattaforma dati, report) uniti da una catena;
       tra il primo e il secondo la catena si spezza e una persona ne tiene insieme i due capi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="80" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="160" cy="60" r="3"/>
    <circle cx="80" cy="95" r="3"/><circle cx="120" cy="95" r="3"/><circle cx="160" cy="95" r="3"/>
  </g>

  <!-- blocco 1: strumenti martech (un browser con un tag e un telefono) -->
  <g transform="translate(90 250)">
    <rect width="220" height="160" rx="14" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
    <rect x="20" y="20" width="130" height="90" rx="8" fill="#e7f1f4" stroke="#9cc6d1" stroke-width="2"/>
    <circle cx="34" cy="32" r="4" fill="#9cc6d1"/><circle cx="48" cy="32" r="4" fill="#9cc6d1"/>
    <path d="M40 60 h44 l14 14 l-14 14 h-44 z" fill="#3a8ea3"/>
    <circle cx="50" cy="74" r="5" fill="#ffffff"/>
    <rect x="164" y="30" width="38" height="70" rx="7" fill="#1f5a68"/>
    <rect x="170" y="40" width="26" height="44" rx="3" fill="#9cc6d1"/>
    <rect x="20" y="126" width="90" height="9" rx="4.5" fill="#c9d3d8"/>
  </g>

  <!-- blocco 2: piattaforma dati (database) -->
  <g transform="translate(600 330)">
    <path d="M-80 -50 L -80 50 A 80 24 0 0 0 80 50 L 80 -50" fill="#1f5a68"/>
    <ellipse cx="0" cy="-50" rx="80" ry="24" fill="#2f7f93"/>
    <path d="M-80 0 A 80 24 0 0 0 80 0" fill="none" stroke="#9cc6d1" stroke-width="3" opacity="0.7"/>
    <path d="M-80 50 A 80 24 0 0 0 80 50" fill="none" stroke="#9cc6d1" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- blocco 3: report -->
  <g transform="translate(900 250)">
    <rect width="210" height="160" rx="14" fill="#ffffff" stroke="#1f5a68" stroke-width="3"/>
    <rect x="22" y="22" width="80" height="9" rx="4.5" fill="#1f5a68"/>
    <rect x="22" y="110" width="26" height="30" rx="4" fill="#9cc6d1"/>
    <rect x="60" y="90" width="26" height="50" rx="4" fill="#3a8ea3"/>
    <rect x="98" y="70" width="26" height="70" rx="4" fill="#1f5a68"/>
    <rect x="136" y="55" width="26" height="85" rx="4" fill="#1f5a68"/>
    <path d="M22 60 L 70 52" stroke="#e0a94a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- catena tra blocco 1 e blocco 2: spezzata al centro -->
  <g fill="none" stroke="#3a8ea3" stroke-width="7">
    <rect x="318" y="316" width="46" height="28" rx="14"/>
    <rect x="350" y="316" width="46" height="28" rx="14" stroke="#9cc6d1"/>
    <rect x="460" y="316" width="46" height="28" rx="14" stroke="#9cc6d1"/>
    <rect x="492" y="316" width="46" height="28" rx="14"/>
  </g>

  <!-- persona che tiene insieme i due capi -->
  <g transform="translate(428 200)">
    <circle cx="0" cy="-12" r="24" fill="#1f5a68"/>
    <path d="M-36 58 C -36 22, 36 22, 36 58 Z" fill="#1f5a68"/>
    <path d="M-28 44 C -40 80, -40 110, -32 128" stroke="#1f5a68" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M28 44 C 40 80, 40 110, 32 128" stroke="#1f5a68" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="54" cy="-40" r="20" fill="#e0a94a" stroke="#ffffff" stroke-width="4"/>
    <path d="M45 -40 l 6 6 l 11 -12" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- catena tra blocco 2 e blocco 3: integra -->
  <g fill="none" stroke="#1f5a68" stroke-width="7">
    <rect x="690" y="316" width="46" height="28" rx="14"/>
    <rect x="722" y="316" width="46" height="28" rx="14"/>
    <rect x="754" y="316" width="46" height="28" rx="14"/>
    <rect x="786" y="316" width="46" height="28" rx="14"/>
    <rect x="818" y="316" width="46" height="28" rx="14"/>
  </g>
</svg>

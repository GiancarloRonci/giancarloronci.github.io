<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: una roadmap a tappe (dati -> analytics -> AI) che parte da una piattaforma comune
       e arriva a un traguardo, sotto lo scudo della governance -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L 11 6 L 1 11 Z" fill="#2f7f93"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="80" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="160" cy="60" r="3"/>
    <circle cx="80" cy="95" r="3"/><circle cx="120" cy="95" r="3"/><circle cx="160" cy="95" r="3"/>
  </g>

  <!-- Piattaforma comune: base su cui poggiano le tappe -->
  <rect x="100" y="470" width="1000" height="56" rx="14" fill="#1f5a68"/>
  <rect x="130" y="492" width="140" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="290" y="492" width="80" height="12" rx="6" fill="#9cc6d1"/>
  <rect x="930" y="492" width="140" height="12" rx="6" fill="#9cc6d1"/>

  <!-- Linea della roadmap -->
  <path d="M150 400 C 300 400, 330 330, 450 330 S 640 260, 760 260 S 930 200, 1010 200" stroke="#2f7f93" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Tappa 1: dati (cilindro) -->
  <g transform="translate(150 400)">
    <circle r="34" fill="#ffffff" stroke="#9cc6d1" stroke-width="4"/>
    <ellipse cx="0" cy="-12" rx="16" ry="6" fill="#2f7f93"/>
    <path d="M-16 -12 L -16 12 A 16 6 0 0 0 16 12 L 16 -12" fill="#2f7f93"/>
    <path d="M-16 0 A 16 6 0 0 0 16 0" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="0" y1="34" x2="0" y2="70" stroke="#9cc6d1" stroke-width="4" stroke-dasharray="4 6"/>
  </g>

  <!-- Tappa 2: analytics (barre) -->
  <g transform="translate(450 330)">
    <circle r="34" fill="#ffffff" stroke="#9cc6d1" stroke-width="4"/>
    <rect x="-16" y="0" width="8" height="14" rx="2" fill="#9cc6d1"/>
    <rect x="-4" y="-10" width="8" height="24" rx="2" fill="#2f7f93"/>
    <rect x="8" y="-18" width="8" height="32" rx="2" fill="#1f5a68"/>
    <line x1="0" y1="34" x2="0" y2="140" stroke="#9cc6d1" stroke-width="4" stroke-dasharray="4 6"/>
  </g>

  <!-- Tappa 3: AI (nodi collegati) -->
  <g transform="translate(760 260)">
    <circle r="34" fill="#ffffff" stroke="#9cc6d1" stroke-width="4"/>
    <g stroke="#2f7f93" stroke-width="3">
      <line x1="-14" y1="-10" x2="12" y2="-14"/><line x1="-14" y1="-10" x2="0" y2="14"/>
      <line x1="12" y1="-14" x2="0" y2="14"/><line x1="12" y1="-14" x2="16" y2="8"/>
    </g>
    <circle cx="-14" cy="-10" r="6" fill="#1f5a68"/><circle cx="12" cy="-14" r="6" fill="#2f7f93"/>
    <circle cx="0" cy="14" r="6" fill="#e0a94a"/><circle cx="16" cy="8" r="5" fill="#9cc6d1"/>
    <line x1="0" y1="34" x2="0" y2="210" stroke="#9cc6d1" stroke-width="4" stroke-dasharray="4 6"/>
  </g>

  <!-- Traguardo: bandiera -->
  <g transform="translate(1040 200)">
    <line x1="0" y1="-10" x2="0" y2="-120" stroke="#1f5a68" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 -118 L 64 -100 L 0 -80 Z" fill="#e0a94a"/>
  </g>

  <!-- Governance: scudo con spunta -->
  <g transform="translate(560 70)">
    <path d="M0 0 L 50 -18 L 100 0 L 100 52 C 100 92, 70 112, 50 122 C 30 112, 0 92, 0 52 Z" fill="#1f5a68" stroke="#ffffff" stroke-width="4"/>
    <path d="M28 54 l 16 16 l 30 -32" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

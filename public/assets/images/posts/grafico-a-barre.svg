<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: colonne grigie in disordine diventano barre ordinate, con una barra evidenziata
       e una tacca per l'obiettivo su ciascuna -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="1040" cy="95" r="3"/><circle cx="1080" cy="95" r="3"/><circle cx="1120" cy="95" r="3"/>
  </g>

  <!-- prima: colonne in disordine, tutte uguali -->
  <g transform="translate(110 150)">
    <rect width="360" height="330" rx="14" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
    <g fill="#c9d3d8">
      <rect x="40" y="170" width="40" height="120" rx="4"/>
      <rect x="100" y="90" width="40" height="200" rx="4"/>
      <rect x="160" y="200" width="40" height="90" rx="4"/>
      <rect x="220" y="130" width="40" height="160" rx="4"/>
      <rect x="280" y="230" width="40" height="60" rx="4"/>
    </g>
    <line x1="30" y1="290" x2="330" y2="290" stroke="#9aa6ad" stroke-width="2"/>
  </g>

  <!-- freccia -->
  <path d="M500 315 L 615 315" stroke="#1f5a68" stroke-width="5" stroke-linecap="round"/>
  <path d="M603 303 L 617 315 L 603 327" stroke="#1f5a68" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dopo: barre ordinate, una evidenziata, tacche dell'obiettivo -->
  <g transform="translate(650 150)">
    <rect width="440" height="330" rx="14" fill="#ffffff" stroke="#1f5a68" stroke-width="3"/>
    <line x1="40" y1="36" x2="40" y2="294" stroke="#9aa6ad" stroke-width="2"/>
    <rect x="40" y="46" width="340" height="30" rx="4" fill="#1f5a68"/>
    <g fill="#9cc6d1">
      <rect x="40" y="96" width="270" height="30" rx="4"/>
      <rect x="40" y="146" width="200" height="30" rx="4"/>
      <rect x="40" y="196" width="150" height="30" rx="4"/>
      <rect x="40" y="246" width="100" height="30" rx="4"/>
    </g>
    <g stroke="#e0a94a" stroke-width="5" stroke-linecap="round">
      <line x1="320" y1="40" x2="320" y2="82"/>
      <line x1="290" y1="90" x2="290" y2="132"/>
      <line x1="230" y1="140" x2="230" y2="182"/>
      <line x1="170" y1="190" x2="170" y2="232"/>
      <line x1="130" y1="240" x2="130" y2="282"/>
    </g>
    <circle cx="420" cy="30" r="22" fill="#e0a94a" stroke="#ffffff" stroke-width="4"/>
    <path d="M410 30 l 7 7 l 12 -13" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

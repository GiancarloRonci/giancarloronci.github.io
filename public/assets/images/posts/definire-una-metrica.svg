<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: tre schede con lo stesso titolo e numeri diversi convergono su una scheda di definizione
       ordinata in righe, da cui esce un unico numero -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="1040" cy="95" r="3"/><circle cx="1080" cy="95" r="3"/><circle cx="1120" cy="95" r="3"/>
  </g>

  <!-- tre schede: stesso titolo, numeri diversi -->
  <g>
    <g transform="translate(90 140)">
      <rect width="170" height="90" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
      <rect x="18" y="18" width="70" height="9" rx="4.5" fill="#1f5a68"/>
      <rect x="18" y="46" width="110" height="24" rx="5" fill="#9cc6d1"/>
    </g>
    <g transform="translate(90 270)">
      <rect width="170" height="90" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
      <rect x="18" y="18" width="70" height="9" rx="4.5" fill="#1f5a68"/>
      <rect x="18" y="46" width="84" height="24" rx="5" fill="#3a8ea3"/>
    </g>
    <g transform="translate(90 400)">
      <rect width="170" height="90" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
      <rect x="18" y="18" width="70" height="9" rx="4.5" fill="#1f5a68"/>
      <rect x="18" y="46" width="130" height="24" rx="5" fill="#9cc6d1"/>
    </g>
  </g>

  <!-- linee che convergono sulla scheda di definizione -->
  <g fill="none" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M270 185 C 360 185, 360 300, 440 300" stroke="#9cc6d1"/>
    <path d="M270 315 L 440 315" stroke="#3a8ea3"/>
    <path d="M270 445 C 360 445, 360 330, 440 330" stroke="#9cc6d1"/>
  </g>

  <!-- scheda di definizione: righe con etichetta e valore -->
  <g transform="translate(450 120)">
    <rect width="300" height="390" rx="14" fill="#ffffff" stroke="#1f5a68" stroke-width="3"/>
    <rect x="26" y="26" width="140" height="12" rx="6" fill="#1f5a68"/>
    <g fill="#c9d3d8">
      <rect x="26" y="70" width="60" height="8" rx="4"/>
      <rect x="26" y="110" width="60" height="8" rx="4"/>
      <rect x="26" y="150" width="60" height="8" rx="4"/>
      <rect x="26" y="190" width="60" height="8" rx="4"/>
      <rect x="26" y="230" width="60" height="8" rx="4"/>
      <rect x="26" y="270" width="60" height="8" rx="4"/>
      <rect x="26" y="310" width="60" height="8" rx="4"/>
    </g>
    <g fill="#9cc6d1">
      <rect x="106" y="70" width="160" height="8" rx="4"/>
      <rect x="106" y="110" width="120" height="8" rx="4"/>
      <rect x="106" y="150" width="150" height="8" rx="4"/>
      <rect x="106" y="190" width="100" height="8" rx="4"/>
      <rect x="106" y="230" width="140" height="8" rx="4"/>
      <rect x="106" y="270" width="90" height="8" rx="4"/>
      <rect x="106" y="310" width="130" height="8" rx="4"/>
    </g>
    <g stroke="#e1e4e8" stroke-width="2">
      <line x1="26" y1="94" x2="274" y2="94"/>
      <line x1="26" y1="134" x2="274" y2="134"/>
      <line x1="26" y1="174" x2="274" y2="174"/>
      <line x1="26" y1="214" x2="274" y2="214"/>
      <line x1="26" y1="254" x2="274" y2="254"/>
      <line x1="26" y1="294" x2="274" y2="294"/>
    </g>
    <circle cx="270" cy="30" r="22" fill="#e0a94a" stroke="#ffffff" stroke-width="4"/>
    <path d="M260 30 l 7 7 l 12 -13" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- un solo numero in uscita -->
  <path d="M765 315 L 900 315" stroke="#1f5a68" stroke-width="5" stroke-linecap="round"/>
  <path d="M888 303 L 902 315 L 888 327" stroke="#1f5a68" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(920 255)">
    <rect width="190" height="120" rx="12" fill="#ffffff" stroke="#1f5a68" stroke-width="3"/>
    <rect x="20" y="20" width="70" height="9" rx="4.5" fill="#1f5a68"/>
    <rect x="20" y="50" width="120" height="30" rx="6" fill="#1f5a68"/>
    <path d="M20 100 L 60 100" stroke="#e0a94a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>

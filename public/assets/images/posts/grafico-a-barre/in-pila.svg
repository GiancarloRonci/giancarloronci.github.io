<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- A sinistra colonne in pila per trimestre, divise per canale, con il totale sopra;
       a destra le stesse colonne al 100%, con la quota dell'online scritta dentro -->
  <rect width="800" height="385" rx="8" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">In pila</text>
  <text x="30" y="62" font-size="13" fill="#6b7780">Totale e composizione nello stesso grafico</text>
  <g>
    <rect x="70" y="230" width="56" height="90" fill="#1f5a68"/>
    <rect x="70" y="194" width="56" height="36" fill="#3a8ea3"/>
    <rect x="70" y="140" width="56" height="54" fill="#9cc6d1"/>
    <rect x="150" y="226.4" width="56" height="93.6" fill="#1f5a68"/>
    <rect x="150" y="179.6" width="56" height="46.8" fill="#3a8ea3"/>
    <rect x="150" y="129.2" width="56" height="50.4" fill="#9cc6d1"/>
    <rect x="230" y="233.6" width="56" height="86.4" fill="#1f5a68"/>
    <rect x="230" y="172.4" width="56" height="61.2" fill="#3a8ea3"/>
    <rect x="230" y="118.4" width="56" height="54" fill="#9cc6d1"/>
    <rect x="310" y="221" width="56" height="99" fill="#1f5a68"/>
    <rect x="310" y="149" width="56" height="72" fill="#3a8ea3"/>
    <rect x="310" y="104" width="56" height="45" fill="#9cc6d1"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="70" y1="230" x2="126" y2="230"/><line x1="70" y1="194" x2="126" y2="194"/>
    <line x1="150" y1="226.4" x2="206" y2="226.4"/><line x1="150" y1="179.6" x2="206" y2="179.6"/>
    <line x1="230" y1="233.6" x2="286" y2="233.6"/><line x1="230" y1="172.4" x2="286" y2="172.4"/>
    <line x1="310" y1="221" x2="366" y2="221"/><line x1="310" y1="149" x2="366" y2="149"/>
  </g>
  <line x1="55" y1="320" x2="380" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" font-weight="600" fill="#1f2d33" text-anchor="middle">
    <text x="98" y="132">100</text><text x="178" y="121">106</text><text x="258" y="110">112</text><text x="338" y="96">120</text>
  </g>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="98" y="340">T1</text><text x="178" y="340">T2</text><text x="258" y="340">T3</text><text x="338" y="340">T4</text>
  </g>
  <g font-size="12" fill="#4a565d">
    <rect x="60" y="358" width="12" height="12" fill="#1f5a68"/><text x="78" y="369">Negozi</text>
    <rect x="140" y="358" width="12" height="12" fill="#3a8ea3"/><text x="158" y="369">Online</text>
    <rect x="215" y="358" width="12" height="12" fill="#9cc6d1"/><text x="233" y="369">Grossisti</text>
  </g>

  <line x1="400" y1="30" x2="400" y2="365" stroke="#e1e4e8" stroke-width="1.5"/>

  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">In pila al 100%</text>
  <text x="430" y="62" font-size="13" fill="#6b7780">Solo le quote: il totale non c’è più</text>
  <g>
    <rect x="470" y="220" width="56" height="100" fill="#1f5a68"/>
    <rect x="470" y="180" width="56" height="40" fill="#3a8ea3"/>
    <rect x="470" y="120" width="56" height="60" fill="#9cc6d1"/>
    <rect x="550" y="221.9" width="56" height="98.1" fill="#1f5a68"/>
    <rect x="550" y="172.8" width="56" height="49.1" fill="#3a8ea3"/>
    <rect x="550" y="120" width="56" height="52.8" fill="#9cc6d1"/>
    <rect x="630" y="234.3" width="56" height="85.7" fill="#1f5a68"/>
    <rect x="630" y="173.6" width="56" height="60.7" fill="#3a8ea3"/>
    <rect x="630" y="120" width="56" height="53.6" fill="#9cc6d1"/>
    <rect x="710" y="228.3" width="56" height="91.7" fill="#1f5a68"/>
    <rect x="710" y="161.6" width="56" height="66.7" fill="#3a8ea3"/>
    <rect x="710" y="120" width="56" height="41.6" fill="#9cc6d1"/>

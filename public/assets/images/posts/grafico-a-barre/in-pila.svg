  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="470" y1="220" x2="526" y2="220"/><line x1="470" y1="180" x2="526" y2="180"/>
    <line x1="550" y1="221.9" x2="606" y2="221.9"/><line x1="550" y1="172.8" x2="606" y2="172.8"/>
    <line x1="630" y1="234.3" x2="686" y2="234.3"/><line x1="630" y1="173.6" x2="686" y2="173.6"/>
    <line x1="710" y1="228.3" x2="766" y2="228.3"/><line x1="710" y1="161.6" x2="766" y2="161.6"/>
  </g>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="498" y="204">20%</text><text x="578" y="201">25%</text><text x="658" y="208">30%</text><text x="738" y="199">33%</text>
  </g>
  <line x1="455" y1="320" x2="780" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="11" fill="#6b7780" text-anchor="end">
    <text x="460" y="124">100%</text><text x="460" y="324">0%</text>
  </g>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="498" y="340">T1</text><text x="578" y="340">T2</text><text x="658" y="340">T3</text><text x="738" y="340">T4</text>
  </g>
</svg>

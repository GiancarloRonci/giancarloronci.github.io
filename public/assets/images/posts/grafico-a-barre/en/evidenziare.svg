<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- English version of ../evidenziare.svg -->
  <rect width="800" height="380" rx="8" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">Before: everything weighs the same</text>
  <text x="30" y="62" font-size="13" fill="#6b7780">Different colours, gridlines, legend</text>
  <g stroke="#dfe3e6" stroke-width="1">
    <line x1="70" y1="270" x2="375" y2="270"/><line x1="70" y1="220" x2="375" y2="220"/>
    <line x1="70" y1="170" x2="375" y2="170"/><line x1="70" y1="120" x2="375" y2="120"/>
  </g>
  <g font-size="11" fill="#6b7780" text-anchor="end">
    <text x="62" y="324">0</text><text x="62" y="274">25</text><text x="62" y="224">50</text>
    <text x="62" y="174">75</text><text x="62" y="124">100</text>
  </g>
  <rect x="75" y="156" width="44" height="164" fill="#4e79a7"/>
  <rect x="137" y="126" width="44" height="194" fill="#f28e2b"/>
  <rect x="199" y="180" width="44" height="140" fill="#e15759"/>
  <rect x="261" y="204" width="44" height="116" fill="#76b7b2"/>
  <rect x="323" y="238" width="44" height="82" fill="#59a14f"/>
  <line x1="70" y1="320" x2="375" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="11" fill="#4a565d">
    <rect x="40" y="345" width="10" height="10" fill="#4e79a7"/><text x="54" y="354">North-West</text>
    <rect x="125" y="345" width="10" height="10" fill="#f28e2b"/><text x="139" y="354">North-East</text>
    <rect x="200" y="345" width="10" height="10" fill="#e15759"/><text x="214" y="354">Centre</text>
    <rect x="265" y="345" width="10" height="10" fill="#76b7b2"/><text x="279" y="354">South</text>
    <rect x="315" y="345" width="10" height="10" fill="#59a14f"/><text x="329" y="354">Islands</text>
  </g>

  <line x1="400" y1="30" x2="400" y2="360" stroke="#e1e4e8" stroke-width="1.5"/>

  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">After: one message</text>
  <text x="430" y="62" font-size="13" fill="#6b7780">Grey for context, colour for the news</text>
  <g fill="#c9d3d8">
    <rect x="460" y="156" width="44" height="164"/>
    <rect x="584" y="180" width="44" height="140"/>
    <rect x="646" y="204" width="44" height="116"/>
    <rect x="708" y="238" width="44" height="82"/>
  </g>
  <rect x="522" y="126" width="44" height="194" fill="#1f5a68"/>
  <line x1="450" y1="320" x2="762" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#6b7780" text-anchor="middle">
    <text x="482" y="148">82</text><text x="606" y="172">70</text><text x="668" y="196">58</text><text x="730" y="230">41</text>
  </g>
  <text x="544" y="118" font-size="13" font-weight="700" fill="#1f5a68" text-anchor="middle">97</text>
  <text x="575" y="92" font-size="12" fill="#1f5a68">North-East: +12% on 2024</text>
  <path d="M572 88 L 554 104" stroke="#1f5a68" stroke-width="1.2"/>
  <g font-size="11" fill="#4a565d" text-anchor="middle">
    <text x="482" y="340">North-West</text><text x="544" y="340" font-weight="700" fill="#1f5a68">North-East</text>
    <text x="606" y="340">Centre</text><text x="668" y="340">South</text><text x="730" y="340">Islands</text>
  </g>

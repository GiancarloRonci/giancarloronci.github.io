<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- English version of ../raggruppate-sovrapposte.svg -->
  <rect width="800" height="380" rx="8" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">Clustered</text>
  <text x="30" y="62" font-size="13" fill="#6b7780">Two series side by side per category</text>
  <g fill="#9cc6d1">
    <rect x="60" y="144" width="28" height="176"/>
    <rect x="140" y="184" width="28" height="136"/>
    <rect x="220" y="210" width="28" height="110"/>
    <rect x="300" y="243" width="28" height="77"/>
  </g>
  <g fill="#1f5a68">
    <rect x="90" y="118" width="28" height="202"/>
    <rect x="170" y="192" width="28" height="128"/>
    <rect x="250" y="195" width="28" height="125"/>
    <rect x="330" y="236" width="28" height="84"/>
  </g>
  <line x1="50" y1="320" x2="370" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="89" y="340">North</text><text x="169" y="340">Centre</text><text x="249" y="340">South</text><text x="329" y="340">Islands</text>
  </g>
  <g font-size="12" fill="#4a565d">
    <rect x="60" y="355" width="12" height="12" fill="#9cc6d1"/><text x="78" y="366">2024</text>
    <rect x="130" y="355" width="12" height="12" fill="#1f5a68"/><text x="148" y="366">2025</text>
  </g>

  <line x1="400" y1="30" x2="400" y2="360" stroke="#e1e4e8" stroke-width="1.5"/>

  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">Overlapping</text>
  <text x="430" y="62" font-size="13" fill="#6b7780">Last year in the background, the change written out</text>
  <g fill="#eef3f5" stroke="#9cc6d1" stroke-width="1.5">
    <rect x="460" y="144" width="40" height="176"/>
    <rect x="540" y="184" width="40" height="136"/>
    <rect x="620" y="210" width="40" height="110"/>
    <rect x="700" y="243" width="40" height="77"/>
  </g>
  <g fill="#1f5a68">
    <rect x="472" y="118" width="40" height="202"/>
    <rect x="552" y="192" width="40" height="128"/>
    <rect x="632" y="195" width="40" height="125"/>
    <rect x="712" y="236" width="40" height="84"/>
  </g>
  <line x1="450" y1="320" x2="762" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="492" y="110" fill="#1f5a68">+15%</text>
    <text x="572" y="176" fill="#c2702a">−6%</text>
    <text x="652" y="187" fill="#1f5a68">+14%</text>
    <text x="732" y="228" fill="#1f5a68">+9%</text>
  </g>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="486" y="340">North</text><text x="566" y="340">Centre</text><text x="646" y="340">South</text><text x="726" y="340">Islands</text>
  </g>
  <g font-size="12" fill="#4a565d">
    <rect x="460" y="355" width="12" height="12" fill="#eef3f5" stroke="#9cc6d1" stroke-width="1.5"/><text x="478" y="366">2024</text>
    <rect x="530" y="355" width="12" height="12" fill="#1f5a68"/><text x="548" y="366">2025</text>
  </g>
</svg>

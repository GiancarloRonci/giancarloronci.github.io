<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- English version of ../ordinamento.svg: the same six categories, alphabetical on the left,
       sorted in descending order on the right -->
  <rect width="800" height="320" rx="8" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">Alphabetical order</text>
  <text x="30" y="62" font-size="13" fill="#6b7780">The eye jumps from bar to bar</text>
  <g font-size="13" fill="#4a565d" text-anchor="end">
    <text x="135" y="102">Accessories</text><text x="135" y="138">Bags</text><text x="135" y="174">Belts</text>
    <text x="135" y="210">Eyewear</text><text x="135" y="246">Footwear</text><text x="135" y="282">Jewellery</text>
  </g>
  <g fill="#9cc6d1">
    <rect x="145" y="85" width="80" height="24"/>
    <rect x="145" y="121" width="148" height="24"/>
    <rect x="145" y="157" width="34" height="24"/>
    <rect x="145" y="193" width="57" height="24"/>
    <rect x="145" y="229" width="190" height="24"/>
    <rect x="145" y="265" width="105" height="24"/>
  </g>
  <line x1="145" y1="75" x2="145" y2="299" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#4a565d">
    <text x="231" y="102">42</text><text x="299" y="138">78</text><text x="185" y="174">18</text>
    <text x="208" y="210">30</text><text x="341" y="246">100</text><text x="256" y="282">55</text>
  </g>

  <line x1="400" y1="30" x2="400" y2="300" stroke="#e1e4e8" stroke-width="1.5"/>

  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">Descending order</text>
  <text x="430" y="62" font-size="13" fill="#6b7780">The ranking reads at a glance</text>
  <g font-size="13" fill="#4a565d" text-anchor="end">
    <text x="535" y="102">Footwear</text><text x="535" y="138">Bags</text><text x="535" y="174">Jewellery</text>
    <text x="535" y="210">Accessories</text><text x="535" y="246">Eyewear</text><text x="535" y="282">Belts</text>
  </g>
  <rect x="545" y="85" width="190" height="24" fill="#1f5a68"/>
  <g fill="#3a8ea3">
    <rect x="545" y="121" width="148" height="24"/>
    <rect x="545" y="157" width="105" height="24"/>
    <rect x="545" y="193" width="80" height="24"/>
    <rect x="545" y="229" width="57" height="24"/>
    <rect x="545" y="265" width="34" height="24"/>
  </g>
  <line x1="545" y1="75" x2="545" y2="299" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#4a565d">
    <text x="741" y="102">100</text><text x="699" y="138">78</text><text x="656" y="174">55</text>
    <text x="631" y="210">42</text><text x="608" y="246">30</text><text x="585" y="282">18</text>
  </g>
</svg>

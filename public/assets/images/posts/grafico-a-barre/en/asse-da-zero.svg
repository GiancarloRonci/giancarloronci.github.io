<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- English version of ../asse-da-zero.svg -->
  <rect width="800" height="360" rx="8" fill="#ffffff"/>

  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">Truncated axis (starts at 94)</text>
  <text x="30" y="62" font-size="13" fill="#b5473a">A 4% gap looks three times bigger</text>
  <g stroke="#eef1f3" stroke-width="1">
    <line x1="80" y1="250" x2="360" y2="250"/><line x1="80" y1="190" x2="360" y2="190"/><line x1="80" y1="130" x2="360" y2="130"/>
  </g>
  <g font-size="12" fill="#6b7780" text-anchor="end">
    <text x="70" y="314">94</text><text x="70" y="254">96</text><text x="70" y="194">98</text><text x="70" y="134">100</text>
  </g>
  <rect x="130" y="250" width="70" height="60" fill="#9cc6d1"/>
  <rect x="250" y="130" width="70" height="180" fill="#3a8ea3"/>
  <line x1="80" y1="310" x2="360" y2="310" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="13" fill="#1f2d33" text-anchor="middle" font-weight="600">
    <text x="165" y="242">96</text><text x="285" y="122">100</text>
  </g>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="165" y="330">Region A</text><text x="285" y="330">Region B</text>
  </g>
  <!-- segno di "taglio" sull'asse -->
  <path d="M74 300 l 12 -6 M74 306 l 12 -6" stroke="#b5473a" stroke-width="2"/>

  <line x1="400" y1="30" x2="400" y2="340" stroke="#e1e4e8" stroke-width="1.5"/>

  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">Axis from zero</text>
  <text x="430" y="62" font-size="13" fill="#1f5a68">The gap shows at its real size</text>
  <g stroke="#eef1f3" stroke-width="1">
    <line x1="480" y1="260" x2="760" y2="260"/><line x1="480" y1="210" x2="760" y2="210"/>
    <line x1="480" y1="160" x2="760" y2="160"/><line x1="480" y1="110" x2="760" y2="110"/>
  </g>
  <g font-size="12" fill="#6b7780" text-anchor="end">
    <text x="470" y="314">0</text><text x="470" y="264">25</text><text x="470" y="214">50</text>
    <text x="470" y="164">75</text><text x="470" y="114">100</text>
  </g>
  <rect x="530" y="118" width="70" height="192" fill="#9cc6d1"/>
  <rect x="650" y="110" width="70" height="200" fill="#3a8ea3"/>
  <line x1="480" y1="310" x2="760" y2="310" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="13" fill="#1f2d33" text-anchor="middle" font-weight="600">
    <text x="565" y="110">96</text><text x="685" y="102">100</text>
  </g>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="565" y="330">Region A</text><text x="685" y="330">Region B</text>
  </g>
</svg>

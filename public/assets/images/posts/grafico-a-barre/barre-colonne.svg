<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- A sinistra colonne verticali per i mesi; a destra barre orizzontali per le regioni -->
  <rect width="800" height="370" rx="8" fill="#ffffff"/>

  <!-- colonne -->
  <text x="30" y="40" font-size="17" font-weight="600" fill="#1f2d33">Colonne</text>
  <text x="30" y="62" font-size="13" fill="#6b7780">Poche categorie, oppure il tempo</text>
  <g fill="#3a8ea3">
    <rect x="60" y="212" width="36" height="108"/>
    <rect x="114" y="190" width="36" height="130"/>
    <rect x="168" y="198" width="36" height="122"/>
    <rect x="222" y="167" width="36" height="153"/>
    <rect x="276" y="158" width="36" height="162"/>
  </g>
  <rect x="330" y="133" width="36" height="187" fill="#1f5a68"/>
  <line x1="50" y1="320" x2="376" y2="320" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#4a565d" text-anchor="middle">
    <text x="78" y="340">Gen</text><text x="132" y="340">Feb</text><text x="186" y="340">Mar</text>
    <text x="240" y="340">Apr</text><text x="294" y="340">Mag</text><text x="348" y="340">Giu</text>
  </g>

  <line x1="400" y1="30" x2="400" y2="345" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- barre -->
  <text x="430" y="40" font-size="17" font-weight="600" fill="#1f2d33">Barre</text>
  <text x="430" y="62" font-size="13" fill="#6b7780">Etichette lunghe e classifiche</text>
  <g font-size="13" fill="#4a565d" text-anchor="end">
    <text x="560" y="112">Lombardia</text><text x="560" y="148">Lazio</text><text x="560" y="184">Veneto</text>
    <text x="560" y="220">Emilia-Romagna</text><text x="560" y="256">Campania</text><text x="560" y="292">Piemonte</text>
  </g>
  <rect x="570" y="95" width="190" height="24" fill="#1f5a68"/>
  <g fill="#3a8ea3">
    <rect x="570" y="131" width="148" height="24"/>
    <rect x="570" y="167" width="125" height="24"/>
    <rect x="570" y="203" width="116" height="24"/>
    <rect x="570" y="239" width="89" height="24"/>
    <rect x="570" y="275" width="80" height="24"/>
  </g>
  <line x1="570" y1="85" x2="570" y2="309" stroke="#9aa6ad" stroke-width="1.5"/>
  <g font-size="12" fill="#4a565d">
    <text x="766" y="112">100</text><text x="724" y="148">78</text><text x="701" y="184">66</text>
    <text x="692" y="220">61</text><text x="665" y="256">47</text><text x="656" y="292">42</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: una finestra di terminale con un elenco di comandi con la barra, uno evidenziato -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="1040" cy="95" r="3"/><circle cx="1080" cy="95" r="3"/><circle cx="1120" cy="95" r="3"/>
  </g>

  <!-- finestra del terminale -->
  <g transform="translate(250 95)">
    <rect width="700" height="440" rx="18" fill="#1f5a68"/>
    <rect width="700" height="52" rx="18" fill="#174652"/>
    <rect y="34" width="700" height="18" fill="#174652"/>
    <circle cx="32" cy="26" r="8" fill="#e0a94a"/>
    <circle cx="58" cy="26" r="8" fill="#9cc6d1" opacity="0.7"/>
    <circle cx="84" cy="26" r="8" fill="#9cc6d1" opacity="0.4"/>

    <!-- prompt con la barra -->
    <text x="40" y="112" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#e0a94a">&gt;</text>
    <text x="72" y="112" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#ffffff">/</text>
    <rect x="96" y="86" width="4" height="32" fill="#ffffff" opacity="0.8"/>

    <!-- elenco dei comandi: barra + nome stilizzato -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#9cc6d1">
      <text x="72" y="178">/</text><rect x="94" y="160" width="110" height="18" rx="9" fill="#9cc6d1" opacity="0.55"/><rect x="230" y="160" width="250" height="18" rx="9" fill="#9cc6d1" opacity="0.25"/>
      <text x="72" y="232">/</text><rect x="94" y="214" width="150" height="18" rx="9" fill="#9cc6d1" opacity="0.55"/><rect x="270" y="214" width="200" height="18" rx="9" fill="#9cc6d1" opacity="0.25"/>
      <text x="72" y="340">/</text><rect x="94" y="322" width="90" height="18" rx="9" fill="#9cc6d1" opacity="0.55"/><rect x="210" y="322" width="290" height="18" rx="9" fill="#9cc6d1" opacity="0.25"/>
      <text x="72" y="394">/</text><rect x="94" y="376" width="130" height="18" rx="9" fill="#9cc6d1" opacity="0.55"/><rect x="250" y="376" width="220" height="18" rx="9" fill="#9cc6d1" opacity="0.25"/>
    </g>

    <!-- comando evidenziato -->
    <rect x="52" y="252" width="600" height="52" rx="10" fill="#ffffff"/>
    <text x="72" y="287" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#1f5a68">/</text>
    <rect x="94" y="269" width="140" height="18" rx="9" fill="#2f7f93"/>
    <rect x="260" y="269" width="240" height="18" rx="9" fill="#9cc6d1"/>
    <circle cx="616" cy="278" r="14" fill="#e0a94a"/>
    <path d="M609 278 l 5 5 l 9 -10" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

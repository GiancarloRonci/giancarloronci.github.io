<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Copertina: modello -> persona che decide -> valore. Il passaggio dal modello alla persona
       è tratteggiato: è il punto in cui molti progetti si fermano -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#e7f1f4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L 11 6 L 1 11 Z" fill="#2f7f93"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#2f7f93" opacity="0.10">
    <circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/>
    <circle cx="1040" cy="95" r="3"/><circle cx="1080" cy="95" r="3"/><circle cx="1120" cy="95" r="3"/>
  </g>

  <!-- 1. Il modello: punti osservati e curva di previsione -->
  <g transform="translate(100 185)">
    <rect width="260" height="260" rx="18" fill="#ffffff" stroke="#9cc6d1" stroke-width="3"/>
    <rect x="28" y="28" width="96" height="12" rx="6" fill="#1f5a68"/>
    <line x1="34" y1="214" x2="230" y2="214" stroke="#e1e4e8" stroke-width="3"/>
    <line x1="34" y1="80" x2="34" y2="214" stroke="#e1e4e8" stroke-width="3"/>
    <g fill="#9cc6d1">
      <circle cx="58" cy="182" r="6"/><circle cx="86" cy="170" r="6"/><circle cx="112" cy="176" r="6"/>
      <circle cx="138" cy="146" r="6"/><circle cx="164" cy="150" r="6"/><circle cx="190" cy="118" r="6"/>
    </g>
    <path d="M48 188 C 100 176, 130 160, 160 144 S 205 108, 228 96" stroke="#2f7f93" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M190 118 C 205 108, 216 102, 228 96" stroke="#e0a94a" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 10"/>
  </g>

  <!-- passaggio modello -> persona: tratteggiato -->
  <path d="M380 315 L 452 315" stroke="#2f7f93" stroke-width="5" stroke-dasharray="10 10" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. La persona che decide, davanti allo schermo -->
  <g transform="translate(470 185)">
    <rect width="260" height="260" rx="18" fill="#ffffff" stroke="#9cc6d1" stroke-width="3"/>
    <circle cx="130" cy="78" r="30" fill="#1f5a68"/>
    <path d="M70 168 C 70 128, 190 128, 190 168 L 190 176 L 70 176 Z" fill="#1f5a68"/>
    <rect x="52" y="160" width="156" height="72" rx="8" fill="#eef0f2" stroke="#9cc6d1" stroke-width="3"/>
    <rect x="68" y="176" width="54" height="9" rx="4.5" fill="#2f7f93"/>
    <rect x="68" y="196" width="88" height="9" rx="4.5" fill="#9cc6d1"/>
    <rect x="68" y="214" width="70" height="9" rx="4.5" fill="#9cc6d1"/>
    <circle cx="184" cy="200" r="13" fill="#e0a94a"/>
  </g>

  <!-- passaggio persona -> valore -->
  <path d="M750 315 L 822 315" stroke="#2f7f93" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. Il valore: decisione migliore, risultato in crescita -->
  <g transform="translate(840 185)">
    <rect width="260" height="260" rx="18" fill="#1f5a68" stroke="#ffffff" stroke-width="4"/>
    <rect x="28" y="28" width="96" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="40" y="170" width="30" height="44" rx="3" fill="#9cc6d1"/>
    <rect x="84" y="148" width="30" height="66" rx="3" fill="#9cc6d1"/>
    <rect x="128" y="120" width="30" height="94" rx="3" fill="#ffffff"/>
    <rect x="172" y="88" width="30" height="126" rx="3" fill="#ffffff"/>
    <path d="M44 150 L 98 128 L 142 100 L 210 64" stroke="#e0a94a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="252" cy="8" r="26" fill="#e0a94a" stroke="#ffffff" stroke-width="4"/>
    <path d="M240 8 l 8 8 l 15 -16" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
